<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw Terminal</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-main: #0d1117;
      --text-primary: #c9d1d9;
      --text-muted: #8b949e;
      --accent-prompt: #00ff41;
      --bg-block: #161b22;
      --accent-cyan: #00f0ff;
      --warn: #f2cc60;
      --error: #ff7b72;
      --border-subtle: rgba(139, 148, 158, 0.45);
      --status-bar-height: 34px;

      color-scheme: dark;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: radial-gradient(1400px 700px at 0% 0%, #111a24 0%, var(--bg-main) 52%);
      font-family:
        "JetBrainsMono Nerd Font",
        "FiraCode Nerd Font",
        "Hack Nerd Font",
        "JetBrains Mono",
        "Fira Code",
        "Hack",
        "Consolas",
        monospace;
      font-size: 14px;
      color: var(--text-primary);
      text-rendering: geometricPrecision;
      letter-spacing: 0.01em;
    }

    #terminal-shell {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: row;
    }

    #sidebar {
      width: 300px;
      min-width: 250px;
      max-width: 400px;
      height: 100vh;
      background-color: #0d1117;
      border-right: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      transition: width 0.2s ease, transform 0.2s ease;
    }

    #sidebar.collapsed {
      width: 0;
      min-width: 0;
      transform: translateX(-100%);
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #161b22;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: bold;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sidebar-toggle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 14px;
      border-radius: 4px;
    }

    .sidebar-toggle:hover {
      background-color: #21262d;
      color: var(--text-primary);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 0;
    }

    .sidebar-content::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar-content::-webkit-scrollbar-track {
      background: #0f141c;
    }

    .sidebar-content::-webkit-scrollbar-thumb {
      background: #27313f;
      border-radius: 3px;
    }

    .sidebar-panel {
      margin-bottom: 4px;
    }

    .sidebar-panel-header {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s;
    }

    .sidebar-panel-header:hover {
      background-color: #161b22;
    }

    .sidebar-panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-primary);
    }

    .sidebar-panel-icon {
      font-size: 14px;
    }

    .sidebar-panel-count {
      font-size: 11px;
      color: var(--text-muted);
      background-color: #21262d;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .sidebar-panel-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.2s ease;
    }

    .sidebar-panel.open .sidebar-panel-content {
      max-height: 400px;
      overflow-y: auto;
    }

    .sidebar-item {
      padding: 6px 16px 6px 36px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-item:hover {
      background-color: #161b22;
      color: var(--text-primary);
    }

    .sidebar-item.active {
      background-color: #1f242c;
      color: var(--accent-cyan);
    }

    .sidebar-item-status {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .sidebar-item-status.running {
      background-color: var(--warn);
      box-shadow: 0 0 4px var(--warn);
    }

    .sidebar-item-status.completed {
      background-color: var(--accent-prompt);
    }

    .sidebar-item-status.failed {
      background-color: var(--error);
    }

    .sidebar-item-status.pending {
      background-color: var(--text-muted);
    }

    .sidebar-item-meta {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: #161b22;
    }

    .sidebar-action-btn {
      padding: 8px 12px;
      font-size: 12px;
      border: 1px solid #30363d;
      background-color: #21262d;
      color: var(--text-primary);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .sidebar-action-btn:hover {
      background-color: #30363d;
      border-color: #484f58;
    }

    .sidebar-action-btn:active {
      transform: translateY(1px);
    }

    .sidebar-action-btn.primary {
      background-color: #1f6feb;
      border-color: #1f6feb;
      color: #ffffff;
    }

    .sidebar-action-btn.primary:hover {
      background-color: #388bfd;
    }

    .sidebar-empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }

    .sidebar-empty-icon {
      font-size: 24px;
      margin-bottom: 8px;
      opacity: 0.5;
    }

    #terminal-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .sidebar-toggle-btn {
      position: absolute;
      left: 300px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 40px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-left: none;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 10px;
      z-index: 50;
      transition: left 0.2s ease;
    }

    .sidebar-toggle-btn:hover {
      background-color: #21262d;
      color: var(--text-primary);
    }

    .sidebar.collapsed ~ .sidebar-toggle-btn {
      left: 0;
    }

    /* Hide collapse button when sidebar is collapsed */
    #sidebar.collapsed .sidebar-toggle {
      visibility: hidden;
      pointer-events: none;
    }

    #terminal {
      width: 100%;
      flex: 1;
      padding: 10px 10px calc(var(--status-bar-height) + 14px);
      overflow-y: auto;
      overflow-x: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }

    .line {
      line-height: 1.6;
      min-height: 1.6em;
      color: var(--text-primary);
    }

    .prompt {
      display: inline-flex;
      align-items: baseline;
      gap: 0.35rem;
      user-select: none;
    }

    .prompt-composite {
      white-space: nowrap;
    }

    .prompt-host {
      color: var(--accent-prompt);
      text-shadow: 0 0 6px rgba(0, 255, 65, 0.25);
    }

    .prompt-home {
      color: #58a6ff;
    }

    .prompt-dollar {
      color: var(--text-primary);
    }

    .input-line {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 8px;
      padding-bottom: 4px;
      position: sticky;
      bottom: var(--status-bar-height);
      background:
        linear-gradient(180deg, rgba(13, 17, 23, 0) 0%, rgba(13, 17, 23, 0.92) 36%, var(--bg-main) 100%);
      z-index: 5;
    }

    .input-line .prompt {
      margin-right: 2px;
    }

    .input-stack {
      flex: 1;
      position: relative;
      min-height: 1.6em;
    }

    .input-ghost {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      color: var(--text-muted);
      white-space: pre;
      pointer-events: none;
      overflow: hidden;
      min-height: 1.6em;
    }

    #input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--accent-prompt);
      font-family: inherit;
      font-size: inherit;
      line-height: 1.6;
      caret-color: var(--accent-prompt);
      position: relative;
      z-index: 1;
    }

    .command-echo .command-text {
      color: var(--text-primary);
    }

    .user-line {
      margin: 0.3rem 0 0.2rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user-prefix {
      user-select: none;
    }

    .user-text {
      color: var(--text-primary);
    }

    .assistant-output {
      margin: 0.25rem 0 0.5rem;
      padding-left: 1.5rem;
      border-left: 2px solid #30363d;
    }

    .assistant-body {
      color: var(--text-primary);
      white-space: normal;
      line-height: 1.6;
      min-height: 1.6em;
    }

    .assistant-body p,
    #terminal p {
      margin: 1rem 0;
    }

    .assistant-body .md-heading {
      margin: 1rem 0 0.5rem;
      line-height: 1.35;
      color: #f0f6fc;
    }

    .assistant-body .md-h1 { font-size: 1.3rem; }
    .assistant-body .md-h2 { font-size: 1.2rem; }
    .assistant-body .md-h3 { font-size: 1.1rem; }
    .assistant-body .md-h4,
    .assistant-body .md-h5,
    .assistant-body .md-h6 { font-size: 1rem; }

    .assistant-body ul,
    .assistant-body ol {
      margin: 0.8rem 0 1rem 1.3rem;
      padding-left: 0.7rem;
    }

    .assistant-body li {
      margin: 0.3rem 0;
    }

    .assistant-body blockquote {
      margin: 1rem 0;
      padding-left: 0.85rem;
      border-left: 2px solid #30363d;
      color: var(--text-muted);
    }

    .assistant-body code {
      font-family: inherit;
      font-size: 0.95em;
      color: #9cdcfe;
    }

    .assistant-body .assistant-code {
      margin: 1rem 0;
      padding: 0.7rem 0.85rem;
      background-color: rgba(22, 27, 34, 0.88);
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow-x: auto;
    }

    .assistant-body .assistant-code code {
      display: block;
      color: var(--text-primary);
      white-space: pre;
    }

    .assistant-body a {
      color: var(--accent-cyan);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }

    .spinner-line {
      color: var(--accent-cyan);
      margin-bottom: 0.25rem;
      display: block;
    }

    .turn-separator {
      width: 50%;
      border-bottom: 1px dashed #30363d;
      margin: 0.45rem 0 2rem 1.5rem;
    }

    .system-info {
      color: var(--text-muted);
    }

    .system-ok {
      color: var(--accent-prompt);
    }

    .system-warn {
      color: var(--warn);
    }

    .system-error {
      color: var(--error);
    }

    .status-bar {
      position: fixed;
      bottom: 0;
      left: 300px;
      right: 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      min-height: 32px;
      padding: 4px 16px;
      background-color: #161b22;
      border-top: 1px solid #30363d;
      color: var(--text-muted);
      font-size: 12px;
      z-index: 100;
      transition: left 0.2s ease;
    }

    #sidebar.collapsed ~ #terminal-container .status-bar {
      left: 0;
    }

    .status-item {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-prompt {
      color: var(--accent-prompt);
    }

    /* ANSI colors */
    .ansi-bold { font-weight: bold; }
    .ansi-dim { opacity: 0.7; color: var(--text-muted); }
    .ansi-italic { font-style: italic; }
    .ansi-underline { text-decoration: underline; }

    .ansi-black { color: #0b0f14; }
    .ansi-red { color: var(--error); }
    .ansi-green { color: var(--accent-prompt); }
    .ansi-yellow { color: var(--warn); }
    .ansi-blue { color: #58a6ff; }
    .ansi-magenta { color: #79c0ff; }
    .ansi-cyan { color: var(--accent-cyan); }
    .ansi-white { color: var(--text-primary); }

    .ansi-bright-black { color: var(--text-muted); }
    .ansi-bright-red { color: #ffa198; }
    .ansi-bright-green { color: #3cf477; }
    .ansi-bright-yellow { color: #ffe380; }
    .ansi-bright-blue { color: #79c0ff; }
    .ansi-bright-magenta { color: #d2a8ff; }
    .ansi-bright-cyan { color: #72fff7; }
    .ansi-bright-white { color: #f0f6fc; }

    .bg-black { background-color: #0b0f14; }
    .bg-red { background-color: rgba(255, 123, 114, 0.2); }
    .bg-green { background-color: rgba(0, 255, 65, 0.2); }
    .bg-yellow { background-color: rgba(242, 204, 96, 0.2); }
    .bg-blue { background-color: rgba(88, 166, 255, 0.2); }
    .bg-magenta { background-color: rgba(210, 168, 255, 0.2); }
    .bg-cyan { background-color: rgba(0, 240, 255, 0.2); }
    .bg-white { background-color: var(--text-primary); }

    #terminal::-webkit-scrollbar {
      width: 10px;
    }
    #terminal::-webkit-scrollbar-track {
      background: #0f141c;
    }
    #terminal::-webkit-scrollbar-thumb {
      background: #27313f;
      border-radius: 5px;
      border: 2px solid #0f141c;
    }
    #terminal::-webkit-scrollbar-thumb:hover {
      background: #3a4a5f;
    }
  </style>
</head>
<body>
  <main id="terminal-shell">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">OpenClaw</span>
        <button class="sidebar-toggle" id="sidebar-collapse" title="Collapse sidebar">◀</button>
      </div>
      <div class="sidebar-content" id="sidebar-content">
        <!-- Tasks Panel -->
        <div class="sidebar-panel open" id="panel-tasks">
          <div class="sidebar-panel-header">
            <span class="sidebar-panel-title">
              <span class="sidebar-panel-icon">📋</span>
              Tasks
            </span>
            <span class="sidebar-panel-count" id="tasks-count">0</span>
          </div>
          <div class="sidebar-panel-content" id="tasks-list">
            <div class="sidebar-empty">
              <div class="sidebar-empty-icon">📋</div>
              No tasks yet
            </div>
          </div>
        </div>

        <!-- Agents Panel -->
        <div class="sidebar-panel open" id="panel-agents">
          <div class="sidebar-panel-header">
            <span class="sidebar-panel-title">
              <span class="sidebar-panel-icon">🤖</span>
              Agents
            </span>
            <span class="sidebar-panel-count" id="agents-count">0</span>
          </div>
          <div class="sidebar-panel-content" id="agents-list">
            <div class="sidebar-empty">
              <div class="sidebar-empty-icon">🤖</div>
              No agents running
            </div>
          </div>
        </div>

        <!-- Context Panel -->
        <div class="sidebar-panel" id="panel-context">
          <div class="sidebar-panel-header">
            <span class="sidebar-panel-title">
              <span class="sidebar-panel-icon">📚</span>
              Context
            </span>
            <span class="sidebar-panel-count" id="context-count">0</span>
          </div>
          <div class="sidebar-panel-content" id="context-list">
            <div class="sidebar-empty">
              <div class="sidebar-empty-icon">📚</div>
              No context loaded
            </div>
          </div>
        </div>
      </div>
      <div class="sidebar-footer">
        <button class="sidebar-action-btn primary" id="btn-spawn">
          <span>⚡</span> Spawn Task
        </button>
        <button class="sidebar-action-btn" id="btn-refresh">
          <span>🔄</span> Refresh
        </button>
      </div>
    </aside>

    <button class="sidebar-toggle-btn" id="sidebar-expand" title="Expand sidebar">▶</button>

    <div id="terminal-container">
      <div id="terminal"></div>
      <div id="status-bar" class="status-bar" aria-live="polite">
        <span id="status-agent" class="status-item status-prompt">[Agent: main]</span>
        <span id="status-ping" class="status-item">[Ping: --ms]</span>
        <span id="status-memory" class="status-item">[Memory: --MB]</span>
        <span id="status-tasks" class="status-item">[Tasks: 0]</span>
        <span id="status-time" class="status-item">[Current Time: --:--:--]</span>
      </div>
    </div>
  </main>
  <script type="module" src="./terminal.mjs"></script>
</body>
</html>
